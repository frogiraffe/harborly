name: Refresh bundled registry data

on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-bundled-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.21"

      - name: Install dependencies
        run: uv sync --locked

      - name: Record the currently bundled registry hash
        id: before
        run: |
          echo "hash=$(jq -r .registry_content_hash src/harborly/data/registry_manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Download latest source snapshots
        run: uv run harborly data download --reference-root data/reference --refresh

      - name: Rebuild the bundled registry
        run: uv run python scripts/build_bundled_registry.py data/reference

      - name: Check whether the registry content actually changed
        id: diff
        run: |
          new_hash=$(jq -r .registry_content_hash src/harborly/data/registry_manifest.json)
          echo "hash=$new_hash" >> "$GITHUB_OUTPUT"
          if [ "$new_hash" = "${{ steps.before.outputs.hash }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "registry_content_hash unchanged ($new_hash); the manifest's snapshot_label/path/sha256 fields still shift with today's date even when the port data itself doesn't, so those get discarded below."
            git checkout -- src/harborly/data
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "registry_content_hash changed: ${{ steps.before.outputs.hash }} -> $new_hash"
          fi

      - name: Open a PR with the refreshed data
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="refresh-bundled-data"
          git fetch origin \
            "refs/heads/$branch:refs/remotes/origin/$branch" || true
          git checkout -B "$branch"
          git add src/harborly/data
          git commit -m "Refresh bundled WPI + GeoNames registry data"
          git push --force-with-lease origin "$branch"
          if [ "$(gh pr view "$branch" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            echo "PR for $branch is already open; the push above updated it"
          else
            gh pr create \
              --title "Refresh bundled registry data" \
              --body "Automated refresh of the WPI + GeoNames registry bundled in the wheel (\`scripts/build_bundled_registry.py\`). registry_content_hash: \`${{ steps.before.outputs.hash }}\` -> \`${{ steps.diff.outputs.hash }}\`. Review the diff in \`src/harborly/data/\` before merging, and bump the package version as part of the merge." \
              --base main \
              --head "$branch"
          fi
