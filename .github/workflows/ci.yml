name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev --extra analysis --extra api --extra fast --extra map --extra tui --extra routing --python ${{ matrix.python-version }}

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts

      - name: Ruff lint
        run: uv run ruff check src tests scripts

      # NumPy stubs require a Python interpreter that parses PEP 695 syntax.
      - name: Mypy
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest -q -rs

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install project and audit dependencies
        run: uv sync --all-extras --group audit --python 3.14

      - name: Scan source for security issues
        run: uv run bandit -r src

      - name: Audit installed dependencies
        run: uv run pip-audit

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install package verification tools
        run: uv sync --group audit --python 3.14

      - name: Build sdist and wheel
        run: uv build

      - name: Validate package metadata
        run: uv run twine check dist/*

      - name: Smoke-test the core-only wheel
        run: |
          python3 -m venv /tmp/sea-mile-ci-smoke
          source /tmp/sea-mile-ci-smoke/bin/activate
          pip install --quiet dist/*.whl
          sea-mile info --json
          python3 -c "from sea_mile import PortRegistry, SeaRouter; assert len(PortRegistry.bundled()) > 0"

      - name: Smoke-test the API, routing, and map workflow
        run: |
          python3 -m venv /tmp/sea-mile-optional-smoke
          source /tmp/sea-mile-optional-smoke/bin/activate
          wheels=(dist/*.whl)
          pip install --quiet "${wheels[0]}[api,routing,map]"
          sea-mile route TRMER GRPIR --html-map /tmp/sea-mile-route.html
          test -s /tmp/sea-mile-route.html
          python3 -c "from fastapi.testclient import TestClient; from sea_mile.api import app; client = TestClient(app); assert client.get('/').status_code == 200; assert client.get('/healthz').json()['status'] == 'ok'"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
