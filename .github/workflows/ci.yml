name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --dev --extra analysis --extra api --extra fast --extra map --extra tui --extra routing --python ${{ matrix.python-version }}

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts

      - name: Ruff lint
        run: uv run ruff check src tests scripts

      - name: Documentation prose lint
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: uv run python scripts/check_docs.py

      # NumPy stubs require a Python interpreter that parses PEP 695 syntax.
      - name: Mypy
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest --cov=harborly -W error::ResourceWarning -W error::pytest.PytestUnraisableExceptionWarning -q -rs

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install declared minimum dependencies
        run: |
          uv venv --python 3.11 .venv-min
          uv pip install \
            --python .venv-min/bin/python \
            --resolution lowest-direct \
            -e '.[analysis,api,fast,map,routing,tui]' \
            'hypothesis>=6.92.7' \
            'jsonschema>=4.0' \
            'markdown-it-py>=4.0' \
            'pytest>=9.1.1' \
            'pytest-cov>=7.0.0'

      - name: Report resolved direct versions
        run: |
          .venv-min/bin/python - <<'PY'
          from importlib.metadata import version

          for package in (
              "httpx",
              "numpy",
              "pandas",
              "pandera",
              "pyarrow",
              "rapidfuzz",
              "tenacity",
          ):
              print(f"{package}=={version(package)}")
          PY

      - name: Run tests against declared minimums
        run: .venv-min/bin/pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install project and audit dependencies
        run: uv sync --locked --all-extras --group audit --python 3.14

      - name: Scan source for security issues
        run: uv run bandit -r src scripts

      - name: Audit installed dependencies
        run: uv run pip-audit

  build:
    runs-on: ubuntu-latest
    needs: [test, minimum-dependencies, security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install package verification tools
        run: uv sync --locked --group audit --python 3.14

      - name: Build sdist and wheel
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          export SOURCE_DATE_EPOCH
          uv build
          uv run python scripts/normalize_sdist.py dist/*.tar.gz

      - name: Verify reproducible artifacts
        run: |
          mkdir /tmp/harborly-repro
          uv build --out-dir /tmp/harborly-repro
          uv run python scripts/normalize_sdist.py /tmp/harborly-repro/*.tar.gz
          for artifact in dist/*; do
            cmp "$artifact" "/tmp/harborly-repro/$(basename "$artifact")"
          done

      - name: Validate package metadata
        run: |
          uv run twine check --strict dist/*
          tar -tzf dist/*.tar.gz | grep '/scripts/normalize_sdist.py$'
          tar -tzf dist/*.tar.gz | grep '/docs/maintainers/RELEASING.md$'

      - name: Smoke-test the core-only wheel
        run: |
          python3 -m venv /tmp/harborly-ci-smoke
          source /tmp/harborly-ci-smoke/bin/activate
          pip install --quiet dist/*.whl
          harborly info --json
          python3 -c "from harborly import PortRegistry, SeaRouter; assert len(PortRegistry.bundled()) > 0"
          python3 -c "import pandas as pd; from harborly.data_contracts import validate_distance_matrix, validate_review_decisions; validate_distance_matrix(['A', 'B'], [[0.0, 1.0], [1.0, 0.0]]); validate_review_decisions(pd.DataFrame([{'row_id': '01', 'chosen_registry_id': 'WPI:1'}]))"

      - name: Smoke-test the API, routing, and map workflow
        run: |
          python3 -m venv /tmp/harborly-optional-smoke
          source /tmp/harborly-optional-smoke/bin/activate
          wheels=(dist/*.whl)
          pip install --quiet "${wheels[0]}[api,routing,map]"
          harborly route TRMER GRPIR --html-map /tmp/harborly-route.html
          test -s /tmp/harborly-route.html
          python3 - <<'PY'
          import asyncio
          import httpx
          from harborly.api import app

          async def smoke() -> None:
              transport = httpx.ASGITransport(app=app)
              async with httpx.AsyncClient(
                  transport=transport,
                  base_url="http://test",
                  follow_redirects=False,
              ) as client:
                  assert (await client.get("/")).status_code == 307
                  assert (await client.get("/healthz")).json()["status"] == "ok"

          asyncio.run(smoke())
          PY

      - name: Generate reproducible CycloneDX SBOM
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          mkdir release-assets
          uv run cyclonedx-py environment /tmp/harborly-ci-smoke/bin/python \
            --pyproject pyproject.toml \
            --mc-type library \
            --output-reproducible \
            --output-format JSON \
            --output-file "release-assets/harborly-$version.cdx.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: release-assets/
