[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harborly"
version = "1.0.0"
description = "Reproducible, source-aware port identity resolution with approximate sea-route distances"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "frogiraffe", email = "work@chiki.dev" }]
keywords = ["ports", "maritime", "geospatial", "nautical-miles", "routing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "numpy>=1.26.4",
    "pandas>=2.2.3",
    "pandera>=0.26.1",
    "pyarrow>=17.0.0",
    "rapidfuzz>=3.9.7",
    "tenacity>=8.2.3",
]

[project.optional-dependencies]
# Sea routing. Search, resolve, and nearest work without it.
routing = [
    "searoute>=1.6.0",
]
# pyproj powers the optional WGS84 route cross-check in `harborly data verify`.
# The demo builder in scripts/ needs the routing extra as well.
analysis = [
    "pyproj>=3.7.2",
]
fast = [
    "scipy>=1.16",
]
tui = [
    "textual>=0.60",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
map = [
    "branca>=0.8",
    "folium>=0.19",
]

[project.scripts]
harborly = "harborly.cli:main"

[project.urls]
Homepage = "https://github.com/frogiraffe/harborly"
Repository = "https://github.com/frogiraffe/harborly"
Issues = "https://github.com/frogiraffe/harborly/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
harborly = ["py.typed", "data/*.json", "data/*.md", "data/*.parquet"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "hypothesis>=6.92.7",
    "jsonschema>=4.0",
    "markdown-it-py>=4.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.22",
]
audit = [
    "bandit>=1.9.4",
    "cyclonedx-bom>=7.0.0",
    "pip-audit>=2.9.0",
    "twine>=6.2.0",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
# The accuracy benchmarks live outside src/ because they are not distributed,
# but their pure logic is unit-tested alongside the package.
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["harborly"]

[tool.coverage.report]
fail_under = 88
show_missing = true
skip_covered = true

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "folium.*",
    "pandas.*",
    "pyproj.*",
    "scipy.*",
    "searoute.*",
    "uvicorn.*",
]
ignore_missing_imports = true
